<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>웨이브뷰 차트</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Layout: TradingView 구성 — 상단 툴바 / 왼쪽 그리기 도구 / 차트(가격 + DI) / 오른쪽 패널 / 맨 오른쪽 아이콘 줄. 패널 사이 4px 회색 간격 */
:root{
  --gap:#e0e3eb; --chrome:#ffffff; --hover:#f0f3fa; --border:#e0e3eb;
  --text:#131722; --sub:#787b86; --blue:#2962ff; --blue-soft:#e3effd;
  --chart:#131313; --chart-grid:#1e1e1e; --chart-text:#b2b5be;
  --up:#0bb38f; --down:#ff4d5e; --signal:#f5c518;
  --font:-apple-system,BlinkMacSystemFont,"Trebuchet MS","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",Roboto,Ubuntu,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--gap);color:var(--text);font-family:var(--font);font-size:14px}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
svg{display:block}

.app{height:100%;display:grid;gap:4px;
  grid-template-columns:44px minmax(0,1fr) 300px 44px;grid-template-rows:38px minmax(0,1fr);
  grid-template-areas:"top top top top" "tools chart panel strip";
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-sizing:border-box}

/* 상단 툴바 */
.top{grid-area:top;background:var(--chrome);display:flex;align-items:center;gap:2px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.sym{display:flex;align-items:center;gap:6px;padding:0 10px;height:30px;border-radius:4px;font-weight:600;font-size:14px;flex:none}
.sym:hover{background:var(--hover)}
.sym select{border:0;background:none;font-weight:700;font-size:14px;padding:0;cursor:pointer;appearance:none}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe58a,#e0a800);flex:none}
.sep{width:1px;height:22px;background:var(--border);margin:0 4px;flex:none}
.tb{height:30px;padding:0 8px;border-radius:4px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;font-size:14.5px;font-weight:500}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{color:var(--blue);background:var(--blue-soft)}
.tb svg{width:22px;height:22px}
.spacer{flex:1}
.feed{font-size:12px;color:var(--sub);padding:0 8px;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.feed i{width:7px;height:7px;border-radius:50%;background:var(--sub)}
.feed.live i{background:var(--up)}

/* 지표 메뉴 */
.menu{position:fixed;z-index:30;background:var(--chrome);border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.18);padding:6px 0;min-width:240px}
.menu label{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer}
.menu label:hover{background:var(--hover)}
.menu small{color:var(--sub);margin-left:auto}

/* 왼쪽 도구 */
.tools{grid-area:tools;background:var(--chrome);display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px}
.tool{width:36px;height:36px;border-radius:4px;display:grid;place-items:center;color:var(--text)}
.tool:hover{background:var(--hover)}
.tool[aria-pressed="true"]{color:var(--blue);background:var(--blue-soft)}
.tool svg{width:28px;height:28px}
.tools hr{width:28px;border:0;border-top:1px solid var(--border);margin:4px 0}

/* 차트 */
.charts{grid-area:chart;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chart)}
#mainWrap{position:relative;flex:1;min-height:0}
#mainChart,#diChart{position:absolute;inset:0}
#overlay{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
#diWrap{position:relative;height:140px;border-top:1px solid #2a2a2a;flex:none}
.legend{position:absolute;left:8px;top:6px;z-index:3;display:flex;flex-direction:column;gap:2px;pointer-events:none;color:#ffffff;text-shadow:0 0 3px #131313,0 0 3px #131313;max-width:calc(100% - 90px)}
.lg-title{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;font-size:16px}
.lg-title .coin{width:16px;height:16px}
.lg-title b{font-weight:600;color:#ffffff}
.ohlc{display:flex;gap:10px;flex-wrap:wrap;font-size:14.5px;font-variant-numeric:tabular-nums;color:#ffffff}
.ohlc span em{font-style:normal}
.ind{pointer-events:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:#ffffff;padding:1px 4px;margin-left:-4px;border-radius:3px;text-align:left}
.ind:hover{background:rgba(255,255,255,.06)}
.ind small{color:#b2b5be;font-size:13px}
.ind svg{width:18px;height:18px;color:#b2b5be;opacity:0}
.ind:hover svg,.ind.off svg{opacity:1}
.ind.off{color:#8a8d96}.ind.off small{color:#6f727c}
.dilabel{position:absolute;left:8px;top:4px;z-index:3;font-size:14px;color:#ffffff;pointer-events:none}
.dilabel small{color:#b2b5be;font-size:13px;margin:0 6px}
.drawhint{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;background:rgba(41,98,255,.92);color:#fff;font-size:12px;padding:5px 10px;border-radius:4px;pointer-events:none;white-space:nowrap}

/* 하단 기간 바 */
.bottom{flex:none;height:34px;background:var(--chrome);border-top:4px solid var(--gap);display:flex;align-items:center;gap:8px;padding:0 6px;min-width:0}
.ranges{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.ranges::-webkit-scrollbar{display:none}
.rb{height:26px;padding:0 8px;border-radius:4px;font-size:14px;white-space:nowrap}
.rb:hover{background:var(--hover)}
.clock{margin-left:auto;font-size:14px;color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}

/* 리플레이 바 */
.replay{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;background:var(--chrome);border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.35);display:flex;align-items:center;gap:2px;padding:4px 6px;white-space:nowrap}
.replay select{border:0;background:none;height:30px;padding:0 4px}
.replay .pos{font-size:12px;color:var(--sub);padding:0 8px;font-variant-numeric:tabular-nums}

/* 오른쪽 패널 */
.panel{grid-area:panel;background:var(--chrome);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--border)}
.ph button{padding:6px 10px;border-radius:4px;font-weight:600;color:var(--sub)}
.ph button[aria-selected="true"]{color:var(--text);background:var(--hover)}
.pb{overflow:auto;min-height:0;flex:1}
.wl-head,.wl-row{display:grid;grid-template-columns:minmax(0,1fr) 84px 64px;gap:4px;align-items:center;padding:0 12px}
.wl-head{height:30px;font-size:13px;color:var(--sub)}
.wl-head span:not(:first-child),.wl-row span:not(:first-child){text-align:right}
.wl-row{height:38px;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
.wl-row:hover{background:var(--hover)}
.wl-row[aria-current="true"]{background:var(--blue-soft)}
.wl-row .s{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-row .s i{width:16px;height:16px;border-radius:50%;flex:none}
.detail{border-top:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.detail .nm{color:var(--sub);font-size:13px}
.detail .px{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.detail .ch{font-size:14px;font-variant-numeric:tabular-nums}
.upc{color:var(--up)} .dnc{color:var(--down)}
.sec{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--border)}
.sec h3{margin:0;font-size:13.5px;color:var(--sub);font-weight:600}
.row{display:flex;gap:6px}
.inp{flex:1;min-width:0;height:32px;border:1px solid var(--border);border-radius:4px;padding:0 8px;background:#fff}
.inp:focus{border-color:var(--blue);outline:0}
.btn{height:32px;padding:0 14px;border-radius:4px;background:var(--blue);color:#fff;font-weight:600;flex:none}
.btn.sub{background:#fff;border:1px solid var(--border);color:var(--text);font-weight:500}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #f0f3fa;font-variant-numeric:tabular-nums}
.list li:last-child{border-bottom:0}
.list .x{color:var(--sub);font-size:12px;padding:2px 6px;border-radius:3px}
.list .x:hover{color:var(--down);background:var(--hover)}
.empty{color:var(--sub);font-size:12px;line-height:1.5}
.log li{flex-direction:column;align-items:flex-start;gap:2px}
.log time{font-size:12.5px;color:var(--sub)}

/* 맨 오른쪽 아이콘 줄 */
.strip{grid-area:strip;background:var(--chrome);display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px}

/* 설정 창 */
.modal{position:fixed;inset:0;z-index:40;background:rgba(19,23,34,.45);display:grid;place-items:center;padding:16px}
.dlg{background:#fff;border-radius:8px;width:min(440px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100% - 32px)}
.dlg header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);font-size:17px;font-weight:600}
.dlg form{padding:16px 20px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);line-height:1.55;margin:0}
.dlg footer{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--border)}

/* 알림 토스트 (트레이딩뷰 얼러트 모양) */
.toasts{position:fixed;left:calc(56px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 32px))}
.toast{background:#fff;border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,.25);display:grid;grid-template-columns:56px 1fr;position:relative;overflow:hidden;animation:in .18s ease-out}
.toast .ic{background:#f0f3fa;display:grid;place-items:center;color:#4a6b8a}
.toast .ic svg{width:28px;height:28px}
.toast .bd{padding:12px 34px 12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.toast .hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.toast .hd span{font-weight:400;font-size:13px;display:flex;align-items:center;gap:4px}
.toast .hd .coin{width:15px;height:15px}
.toast .msg{font-size:13.5px;overflow-wrap:anywhere}
.toast .cl{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:4px;font-size:18px;line-height:1;color:var(--sub)}
.toast .cl:hover{background:var(--hover)}
@keyframes in{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

@media (max-width:900px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;grid-template-areas:"top" "tools" "chart" "panel"}
  .tools{flex-direction:row;padding:4px 8px;overflow-x:auto}
  .tools hr{width:1px;height:24px;border:0;border-left:1px solid var(--border);margin:0 4px}
  .charts{height:64vh;min-height:420px}
  .strip{display:none}
  .panel{min-height:360px}
  .toasts{left:calc(16px + env(safe-area-inset-left,0px))}
  .ind small{display:none}
}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <label class="sym"><span class="coin" id="symIcon"></span><select id="sym" aria-label="종목"></select></label>
    <span class="sep"></span>
    <div id="tfs" style="display:flex;gap:2px" role="group" aria-label="타임프레임"></div>
    <span class="sep"></span>
    <button class="tb" id="indBtn" aria-haspopup="true"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 21l6-7 5 4 9-10"/><path d="M19 8h5v5"/></svg>지표</button>
    <span class="sep"></span>
    <button class="tb" id="alertBtn"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="14" cy="15" r="8"/><path d="M14 11v4.5l3 2M6.5 6.5L9 4.5M21.5 6.5L19 4.5"/></svg>얼러트</button>
    <button class="tb" id="replayBtn" aria-pressed="false"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M13 8l-6 6 6 6M21 8l-6 6 6 6"/></svg>리플레이</button>
    <span class="spacer"></span>
    <span class="feed" id="feed"><i></i><span>연결 중</span></span>
    <button class="tb" id="setBtn" title="시세 · 텔레그램 설정"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="14" cy="14" r="3.5"/><path d="M14 4.5v3M14 20.5v3M4.5 14h3M20.5 14h3M7.3 7.3l2.1 2.1M18.6 18.6l2.1 2.1M7.3 20.7l2.1-2.1M18.6 9.4l2.1-2.1"/></svg></button>
  </header>

  <nav class="tools" aria-label="그리기 도구">
    <button class="tool" data-mode="cursor" aria-pressed="true" title="십자선"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M14 5v18M5 14h18"/></svg></button>
    <button class="tool" data-mode="trend" aria-pressed="false" title="추세선"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8.5 19.5l11-11"/><circle cx="7" cy="21" r="2"/><circle cx="21" cy="7" r="2"/></svg></button>
    <button class="tool" data-mode="hline" aria-pressed="false" title="수평선"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M4 14h7.5M16.5 14H24"/><circle cx="14" cy="14" r="2"/></svg></button>
    <button class="tool" data-mode="alert" aria-pressed="false" title="가격 얼러트"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="14" cy="15" r="7.5"/><path d="M14 11v4.5l3 2M6.5 6.5L9 4.5M21.5 6.5L19 4.5"/></svg></button>
    <hr>
    <button class="tool" id="clearBtn" title="그린 것 모두 지우기"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M7 9h14M11.5 9V6.5h5V9M9 9l1 13h8l1-13M12.5 12.5v6M15.5 12.5v6"/></svg></button>
  </nav>

  <section class="charts">
    <div id="mainWrap">
      <div id="mainChart"></div>
      <canvas id="overlay"></canvas>
      <div class="legend">
        <div class="lg-title"><span class="coin" id="lgCoin"></span><b id="lgName"></b><span class="ohlc" id="lgOhlc"></span></div>
        <div id="lgInds"></div>
      </div>
      <div class="drawhint" id="hint" hidden></div>
      <div class="replay" id="replayBar" hidden>
        <button class="tb" id="rp-play">재생</button>
        <button class="tb" id="rp-step">한 봉 앞으로</button>
        <select id="rp-speed" aria-label="재생 속도"><option value="1000">1x</option><option value="333">3x</option><option value="100">10x</option></select>
        <span class="pos" id="rp-pos"></span>
        <button class="tb" id="rp-exit">리플레이 종료</button>
      </div>
    </div>
    <div id="diWrap">
      <div id="diChart"></div>
      <div class="dilabel" id="diLabel"></div>
    </div>
    <div class="bottom"><div class="ranges" id="ranges" role="group" aria-label="기간"></div><span class="clock" id="clock"></span></div>
  </section>

  <aside class="panel">
    <div class="ph" role="tablist">
      <button role="tab" data-tab="wl" aria-selected="true">관심종목</button>
      <button role="tab" data-tab="al" aria-selected="false">얼러트</button>
    </div>
    <div class="pb" id="tab-wl">
      <div class="wl-head"><span>심볼</span><span>현재가</span><span>변동%</span></div>
      <div id="wl"></div>
      <div class="detail" id="detail"></div>
    </div>
    <div class="pb" id="tab-al" hidden>
      <div class="sec">
        <h3>얼러트 만들기</h3>
        <form class="row" id="alertForm">
          <input class="inp" id="alertPrice" inputmode="decimal" placeholder="가격" aria-label="얼러트 가격">
          <button class="btn" type="submit">만들기</button>
        </form>
        <p class="note">왼쪽 시계 도구로 차트를 클릭해도 만들 수 있습니다.</p>
      </div>
      <div class="sec"><h3>활성 얼러트</h3><ul class="list" id="alertList"></ul></div>
      <div class="sec"><h3>얼러트 기록</h3><ul class="list log" id="log"></ul></div>
    </div>
  </aside>

  <nav class="strip" aria-label="패널">
    <button class="tool" data-strip="wl" aria-pressed="true" title="관심종목"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M8 8.5h13M8 14h13M8 19.5h13"/><circle cx="5" cy="8.5" r=".8" fill="currentColor"/><circle cx="5" cy="14" r=".8" fill="currentColor"/><circle cx="5" cy="19.5" r=".8" fill="currentColor"/></svg></button>
    <button class="tool" data-strip="al" aria-pressed="false" title="얼러트"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="14" cy="15" r="7.5"/><path d="M14 11v4.5l3 2M6.5 6.5L9 4.5M21.5 6.5L19 4.5"/></svg></button>
  </nav>
</div>

<div class="menu" id="indMenu" hidden></div>

<div class="modal" id="setModal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="setTitle">
    <header><span id="setTitle">시세 · 텔레그램 설정</span><button class="tb" id="setClose" aria-label="닫기">✕</button></header>
    <form id="setForm">
      <label style="display:flex;gap:8px;align-items:center;font-weight:600"><input type="checkbox" id="setMt5">한텍 MT5 연결 (PC에서 브리지 실행 필요)</label>
      <p class="note">브리지 받기: <a href="https://jerry797979.github.io/waveview/waveview-mt5-bridge.zip" target="_blank" rel="noopener">waveview-mt5-bridge.zip</a> · 압축을 풀고 MT5 를 켠 상태에서 start_bridge.bat 을 더블클릭하세요.</p>
      <div class="field"><label for="setMt5Url">MT5 브리지 주소</label><input class="inp" id="setMt5Url" autocomplete="off" placeholder="http://127.0.0.1:8765"></div>
      <div class="field"><label for="setTd">Twelve Data API 키 (금·나스닥 실시간 시세)</label><input class="inp" id="setTd" autocomplete="off" placeholder="twelvedata.com 에서 무료 발급"></div>
      <div class="field"><label for="setPoll">시세 갱신 주기 (초)</label><input class="inp" id="setPoll" inputmode="numeric" placeholder="120"></div>
      <div class="field"><label for="setTg">텔레그램 봇 토큰</label><input class="inp" id="setTg" autocomplete="off" placeholder="123456:ABC-..."></div>
      <div class="field"><label for="setChat">텔레그램 채팅 ID</label><input class="inp" id="setChat" autocomplete="off" placeholder="봇에게 메시지를 보낸 뒤 '채팅 ID 찾기'"></div>
      <p class="note">키와 토큰은 이 브라우저에만 저장됩니다. 이 페이지가 열려 있는 동안 얼러트가 텔레그램으로도 전송됩니다.</p>
      <p class="note">차트 엔진: <a href="https://www.tradingview.com/lightweight-charts/" target="_blank" rel="noopener">TradingView Lightweight Charts™</a></p>
    </form>
    <footer>
      <button class="btn sub" type="button" id="tgFind">채팅 ID 찾기</button>

<script>
(() => {
const LW = window.LightweightCharts;
const $ = s => document.querySelector(s);
const KST = 9 * 3600;
const C = { bg:'#131313', grid:'#1e1e1e', text:'#e0e3eb', line:'#2a2a2a', up:'#089981', down:'#f23645', signal:'#f5c518',
  basis:'#4caf50', inner:'#f23645', outer:'#e8e8e8', ma60:'#42a5f5', ma200:'#ff9800', trend:'#2962ff',
  asia:'255,193,7', eu:'0,188,212', us:'186,104,200' };
// [키, 초, 표시, Twelve Data 주기, 바이낸스 주기, 없을 때 합성할 원본]
const TFS = [
  ['1m',60,'1분','1min','1m'], ['2m',120,'2분',null,null,'1m'], ['3m',180,'3분',null,'3m','1m'],
  ['5m',300,'5분','5min','5m'], ['10m',600,'10분',null,null,'5m'], ['15m',900,'15분','15min','15m'],
  ['30m',1800,'30분','30min','30m'], ['1h',3600,'1시간','1h','1h'], ['2h',7200,'2시간','2h','2h'],
  ['3h',10800,'3시간',null,null,'1h'], ['4h',14400,'4시간','4h','4h'], ['8h',28800,'8시간','8h','8h'],
  ['1D',86400,'날','1day','1d'], ['1W',604800,'주','1week','1w'], ['1M',2592000,'달','1month','1M'],
];
const tfBy = k => TFS.find(t => t[0] === k);
// 트레이딩뷰 하단 기간 버튼: [표시, 기간(초), 자동 타임프레임]
const RANGES = [['1일',86400,'1m'],['5일',432000,'5m'],['1개월',2592000,'30m'],['3개월',7776000,'1h'],['6개월',15552000,'2h'],
  ['YTD','ytd','1D'],['1년',31536000,'1D'],['5년',157680000,'1W'],['전체',Infinity,'1M']];
function aggregate(bars, sec){
  const out = [];
  for (const b of bars){
    const t = Math.floor(b.time / sec) * sec, l = out[out.length - 1];
    if (l && l.time === t){ l.high = Math.max(l.high, b.high); l.low = Math.min(l.low, b.low); l.close = b.close; }
    else out.push({ time:t, open:b.open, high:b.high, low:b.low, close:b.close });
  }
  return out;
}
let SYMS = [
  { id:'XAUUSD', name:'금 현물 / 미국 달러', ex:'FOREX', base:4165.91, dvol:.011, dp:2, feed:'td', td:'XAU/USD', icon:'radial-gradient(circle at 35% 35%,#ffe58a,#e0a800)' },
  { id:'NAS100', name:'나스닥 100 지수', ex:'INDEX', base:24850, dvol:.012, dp:1, feed:'td', td:'NDX', icon:'#2962ff' },
  { id:'BTCUSDT', name:'비트코인 / 테더', ex:'BINANCE', base:97500, dvol:.028, dp:1, feed:'binance', icon:'#f7931a' },
  { id:'ETHUSDT', name:'이더리움 / 테더', ex:'BINANCE', base:3450, dvol:.035, dp:2, feed:'binance', icon:'#627eea' },
];
const IND = [
  ['bb','더블 볼린저밴드','20 2 4'],
  ['ma','이동평균','20 60 200'],
  ['db','돌파 더블비 신호','몸통 마감'],
  ['ses','세션박스','1시간 이하'],
  ['us','어제 미장 구간 고저 라인',''],
  ['low','최저점꼬리','500'],
  ['di','DI 이격도','14 close'],
];
const EYE = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1.5 9S4.5 4 9 4s7.5 5 7.5 5-3 5-7.5 5S1.5 9 1.5 9z"/><circle cx="9" cy="9" r="2.2"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M1.5 9S4.5 4 9 4s7.5 5 7.5 5-3 5-7.5 5S1.5 9 1.5 9z"/><circle cx="9" cy="9" r="2.2"/><path d="M3 15L15 3"/></svg>';
const CLOCK = '<svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="14" cy="15" r="8"/><path d="M14 11v4.5l3 2M6.5 6.5L9 4.5M21.5 6.5L19 4.5"/></svg>';

const store = {
  get(k, d){ try { const v = localStorage.getItem('wv:'+k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem('wv:'+k, JSON.stringify(v)); } catch {} },
};

const S = {
  sym: SYMS.find(s => s.id === store.get('sym')) || SYMS[0],
  tf: TFS.find(t => t[0] === store.get('tf')) || tfBy('4h'), range: null,
  bars: [], ind: null, sess: [], mode: 'cursor', ticks: 0,
  show: Object.assign({ bb:true, ma:true, db:true, ses:true, us:true, low:true, di:true }, store.get('show', {})),
  hlines: [], alerts: [], trends: [], draft: null, log: [], quotes: {}, timer: null, ws: null, live: false, loadId: 0,
  cfg: Object.assign({ td:'', poll:120, tg:'', chat:'', mt5:false, mt5url:'http://127.0.0.1:8765' }, store.get('cfg', {})), rp: null, qtimer: null,
};

/* ---------- 데이터 ---------- */
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function gauss(R){ let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

function genBars(sym, tf, n = 1500){
  const R = rng(hash(sym.id + tf));
  const sig = sym.dvol * Math.sqrt(tf / 86400);
  const logs = [0]; let drift = 0;
  for (let i = 1; i <= n; i++){
    drift = drift * .985 + gauss(R) * sig * .02;
    logs.push(logs[i-1] + drift + gauss(R) * sig);
  }
  const shift = Math.log(sym.base) - logs[n];
  const end = Math.floor((Date.now() / 1000 + KST) / tf) * tf;
  const bars = [];
  for (let i = 0; i < n; i++){
    const o = Math.exp(logs[i] + shift), c = Math.exp(logs[i+1] + shift);
    const h = Math.max(o, c) * Math.exp(Math.abs(gauss(R)) * sig * .45);
    const l = Math.min(o, c) * Math.exp(-Math.abs(gauss(R)) * sig * .45);
    bars.push({ time: end - (n - 1 - i) * tf, open:o, high:h, low:l, close:c });
  }
  return bars;
}

/* ---------- 지표 ---------- */
function sma(v, n){ const o = Array(v.length).fill(null); let s = 0; for (let i = 0; i < v.length; i++){ s += v[i]; if (i >= n) s -= v[i-n]; if (i >= n-1) o[i] = s / n; } return o; }
function compute(bars){
  const c = bars.map(b => b.close), N = c.length;
  const m = sma(c, 20), ui = [], li = [], uo = [], lo = [];
  for (let i = 0; i < N; i++){
    if (m[i] == null){ ui.push(null); li.push(null); uo.push(null); lo.push(null); continue; }
    let s = 0; for (let j = i - 19; j <= i; j++) s += (c[j] - m[i]) ** 2;
    const sd = Math.sqrt(s / 20);
    ui.push(m[i] + 2*sd); li.push(m[i] - 2*sd); uo.push(m[i] + 4*sd); lo.push(m[i] - 4*sd);
  }
  const m14 = sma(c, 14);
  const di = c.map((x, i) => m14[i] == null ? null : (x - m14[i]) / m14[i] * 100);
  const dn = [], up = [];
  for (let i = 0; i < N; i++){
    const b = bars[i];
    dn.push(li[i] != null && Math.max(b.open, b.close) < li[i]);
    up.push(ui[i] != null && Math.min(b.open, b.close) > ui[i]);
  }
  return { m, ui, li, uo, lo, ma60: sma(c, 60), ma200: sma(c, 200), di, dn, up };
}
const isDn = i => S.ind.dn[i] && !S.ind.dn[i-1];
const isUp = i => S.ind.up[i] && !S.ind.up[i-1];

function sessOf(t){
  const d = new Date(t * 1000), m = d.getUTCHours() * 60 + d.getUTCMinutes();
  if (m >= 540 && m < 960) return 'asia';
  if (m >= 960 && m < 1350) return 'eu';
  if (m >= 1350 || m < 300) return 'us';
  return null;
}
function sessions(bars, tf){
  const out = []; let cur = null;
  bars.forEach((b, i) => {
    const s = tf <= 14400 ? sessOf(b.time) : null;
    if (s && cur && cur.s === s && b.time - cur.t1 <= tf){
      cur.i1 = i; cur.t1 = b.time; cur.hi = Math.max(cur.hi, b.high); cur.lo = Math.min(cur.lo, b.low);
    } else {
      if (cur) out.push(cur);
      cur = s ? { s, i0:i, i1:i, t1:b.time, hi:b.high, lo:b.low } : null;
    }
  });
  if (cur) out.push(cur);
  return out;
}

/* ---------- 차트 ---------- */
const base = {
  autoSize: true,
  layout: { background:{ type:'solid', color:C.bg }, textColor:C.text, fontSize:13, attributionLogo:false,
    fontFamily:'-apple-system, BlinkMacSystemFont, "Trebuchet MS", "Malgun Gothic", "Apple SD Gothic Neo", Roboto, Ubuntu, sans-serif' },
  grid: { vertLines:{ color:C.grid }, horzLines:{ color:C.grid } },
  rightPriceScale: { borderColor:C.line, minimumWidth:76 },
  crosshair: { mode: LW.CrosshairMode.Normal,
    vertLine:{ color:'#9598a1', style:3, labelBackgroundColor:'#363a45' },
    horzLine:{ color:'#9598a1', style:3, labelBackgroundColor:'#363a45' } },
};
const tsOpt = { borderColor:C.line, timeVisible:true, secondsVisible:false, rightOffset:12, barSpacing:7 };
const chart = LW.createChart($('#mainChart'), { ...base,
  rightPriceScale: { ...base.rightPriceScale, scaleMargins:{ top:.14, bottom:.06 } }, timeScale:{ ...tsOpt, visible:false } });
const diChart = LW.createChart($('#diChart'), { ...base, timeScale:tsOpt,
  rightPriceScale: { ...base.rightPriceScale, scaleMargins:{ top:.2, bottom:.1 } } });

const candle = chart.addCandlestickSeries({ upColor:C.up, downColor:C.down, borderUpColor:C.up, borderDownColor:C.down, wickUpColor:C.up, wickDownColor:C.down });
const ln = (color, width = 1) => chart.addLineSeries({ color, lineWidth:width, priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false });
const L = { m: ln(C.basis), ui: ln(C.inner), li: ln(C.inner), uo: ln(C.outer), lo: ln(C.outer), ma60: ln(C.ma60), ma200: ln(C.ma200, 2) };
const diSeries = diChart.addBaselineSeries({ baseValue:{ type:'price', price:0 }, lineWidth:2,
  topLineColor:'#4caf50', topFillColor1:'rgba(76,175,80,0)', topFillColor2:'rgba(76,175,80,0)',
  bottomLineColor:C.down, bottomFillColor1:'rgba(242,54,69,0)', bottomFillColor2:'rgba(242,54,69,0)', priceLineVisible:false });
[1, .5, -.5, -1].forEach(p => diSeries.createPriceLine({ price:p, color:'#787b86', lineStyle:2, lineWidth:1, axisLabelVisible:true, title:'' }));

let syncing = false;
const sync = (a, b) => a.timeScale().subscribeVisibleLogicalRangeChange(r => {
  if (syncing || !r) return; syncing = true; b.timeScale().setVisibleLogicalRange(r); syncing = false;
});
sync(chart, diChart); sync(diChart, chart);

const fmt = (v, dp = S.sym.dp) => v == null || isNaN(v) ? '—' : v.toLocaleString('en-US', { minimumFractionDigits:dp, maximumFractionDigits:dp });
const lineData = arr => S.bars.map((b, i) => arr[i] == null ? { time:b.time } : { time:b.time, value:arr[i] });

function applyFormat(){
  const pf = { type:'price', precision:S.sym.dp, minMove: 10 ** -S.sym.dp };
  candle.applyOptions({ priceFormat:pf });
  Object.values(L).forEach(s => s.applyOptions({ priceFormat:pf }));
  diSeries.applyOptions({ priceFormat:{ type:'price', precision:2, minMove:.01 } });
}
function applyVisibility(){
  const v = S.show;
  ['m','ui','li','uo','lo'].forEach(k => L[k].applyOptions({ visible:v.bb }));
  ['ma60','ma200'].forEach(k => L[k].applyOptions({ visible:v.ma }));
  $('#diWrap').hidden = !v.di;
  chart.applyOptions({ timeScale:{ visible:!v.di } });
  renderMarkers(); renderRefLines(); renderLegend(); renderMenu();
}
function renderAll(){
  S.ind = compute(S.bars);
  S.sess = sessions(S.bars, S.tf[1]);
  candle.setData(S.bars);
  for (const k of Object.keys(L)) L[k].setData(lineData(S.ind[k]));
  diSeries.setData(lineData(S.ind.di));
  renderMarkers(); renderRefLines(); renderLegend(); updateQuote();
}
function renderLast(newBar){
  S.ind = compute(S.bars);
  S.sess = sessions(S.bars, S.tf[1]);
  const i = S.bars.length - 1, t = S.bars[i].time;
  candle.update(S.bars[i]);
  for (const k of Object.keys(L)) L[k].update(S.ind[k][i] == null ? { time:t } : { time:t, value:S.ind[k][i] });
  diSeries.update(S.ind.di[i] == null ? { time:t } : { time:t, value:S.ind.di[i] });
  if (newBar){ renderMarkers(); renderRefLines(); } else renderLowLine();
  renderOhlc(); updateQuote();
}
function renderMarkers(){
  if (!S.ind) return;
  const mk = [];
  if (S.show.db){
    for (let i = 1; i < S.bars.length - 1; i++){
      const t = S.bars[i].time;
      if (isDn(i)) mk.push({ time:t, position:'belowBar', color:C.signal, shape:'arrowDown', text:'DB' });
      if (isUp(i)) mk.push({ time:t, position:'aboveBar', color:C.signal, shape:'arrowUp', text:'DB' });
    }
  }
  candle.setMarkers(mk);
}
let refLines = [], lowLine = null;
function renderRefLines(){
  refLines.forEach(l => candle.removePriceLine(l)); refLines = [];
  if (S.show.us){
    const last = S.bars.length - 1;
    const us = sessions(S.bars, Math.min(S.tf[1], 14400)).filter(b => b.s === 'us' && b.i1 < last);
    const y = us[us.length - 1];
    if (y){
      refLines.push(candle.createPriceLine({ price:y.hi, color:'#8bc34a', lineWidth:2, lineStyle:0, title:'' }));
      refLines.push(candle.createPriceLine({ price:y.lo, color:C.down, lineWidth:2, lineStyle:0, title:'' }));
    }
  }
  renderLowLine();
}
function renderLowLine(){
  if (lowLine){ candle.removePriceLine(lowLine); lowLine = null; }
  if (!S.show.low || !S.bars.length) return;
  const lo = Math.min(...S.bars.slice(-500).map(b => b.low));
  lowLine = candle.createPriceLine({ price:lo, color:'#8bc34a', lineWidth:1, lineStyle:2, title:'최저점꼬리' });
}

/* ---------- 오버레이: 세션박스 + 추세선 ---------- */
const cv = $('#overlay'), ctx = cv.getContext('2d');
function timeToIdx(t){
  const b = S.bars, n = b.length; if (!n) return null;
  if (t >= b[n-1].time) return n - 1 + (t - b[n-1].time) / S.tf[1];
  let lo = 0, hi = n - 1;
  while (lo < hi){ const mid = (lo + hi) >> 1; if (b[mid].time < t) lo = mid + 1; else hi = mid; }
  return lo;
}
function idxToTime(i){ const b = S.bars, n = b.length; i = Math.round(i); return i < n ? b[Math.max(0, i)].time : b[n-1].time + (i - n + 1) * S.tf[1]; }
function drawOverlay(){
  const wrap = $('#mainWrap'), w = wrap.clientWidth, h = wrap.clientHeight, dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + 'px'; cv.style.height = h + 'px';
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const ts = chart.timeScale(), pw = ts.width();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, pw, h); ctx.clip();

  if (S.show.ses && S.tf[1] <= 3600 && S.sess.length){
    const half = (ts.options().barSpacing || 6) / 2, range = ts.getVisibleLogicalRange();
    const names = { asia:'아시아', eu:'유로', us:'미장' };
    ctx.font = '11px -apple-system, "Malgun Gothic", sans-serif';
    for (const b of S.sess){
      if (range && (b.i1 < range.from - 1 || b.i0 > range.to + 1)) continue;
      const x1 = ts.logicalToCoordinate(b.i0), x2 = ts.logicalToCoordinate(b.i1);
      const y1 = candle.priceToCoordinate(b.hi), y2 = candle.priceToCoordinate(b.lo);
      if ([x1, x2, y1, y2].some(v => v == null)) continue;
      const rgb = C[b.s], x = Math.round(x1 - half), bw = Math.round(x2 - x1 + half * 2);
      ctx.fillStyle = `rgba(${rgb},.06)`; ctx.fillRect(x, y1, bw, y2 - y1);
      ctx.strokeStyle = `rgba(${rgb},.35)`; ctx.lineWidth = 1;
      ctx.strokeRect(x + .5, Math.round(y1) + .5, bw - 1, Math.round(y2 - y1));
      if (bw > 40){ ctx.fillStyle = `rgba(${rgb},.85)`; ctx.fillText(names[b.s], x + 4, y1 - 5); }
    }
  }

  const lines = S.trends.slice(); if (S.draft && S.draft.b) lines.push(S.draft);
  for (const t of lines){
    const xa = ts.logicalToCoordinate(timeToIdx(t.a.t)), xb = ts.logicalToCoordinate(timeToIdx(t.b.t));
    const ya = candle.priceToCoordinate(t.a.p), yb = candle.priceToCoordinate(t.b.p);
    if ([xa, xb, ya, yb].some(v => v == null)) continue;
    ctx.strokeStyle = C.trend; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(xa, ya); ctx.lineTo(xb, yb); ctx.stroke();
    ctx.fillStyle = C.bg;
    for (const [x, y] of [[xa, ya], [xb, yb]]){ ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill(); ctx.stroke(); }
  }
  ctx.restore();
  requestAnimationFrame(drawOverlay);
}

/* ---------- 범례 ---------- */
let hoverBar = null;
chart.subscribeCrosshairMove(p => {
  hoverBar = p && p.time ? p.seriesData.get(candle) || null : null;
  if (S.draft && p && p.point && p.logical != null){
    const price = candle.coordinateToPrice(p.point.y);
    if (price != null) S.draft.b = { t:idxToTime(p.logical), p:price };
  }
  renderOhlc();
  if (!diChart.setCrosshairPosition) return;
  if (p && p.time){
    const i = S.bars.findIndex(b => b.time === p.time);
    const v = i >= 0 ? S.ind.di[i] : null;
    if (v != null) diChart.setCrosshairPosition(v, p.time, diSeries); else diChart.clearCrosshairPosition();
  } else diChart.clearCrosshairPosition();
});
function renderOhlc(){
  const b = hoverBar || S.bars[S.bars.length - 1]; if (!b) return;
  const i = S.bars.findIndex(x => x.time === b.time);
  const prev = i > 0 ? S.bars[i-1].close : b.open;
  const ch = b.close - prev, pct = ch / prev * 100, cls = b.close >= b.open ? 'upc' : 'dnc', sg = ch >= 0 ? '+' : '';
  $('#lgOhlc').innerHTML = `<span>시<em class="${cls}">${fmt(b.open)}</em></span><span>고<em class="${cls}">${fmt(b.high)}</em></span><span>저<em class="${cls}">${fmt(b.low)}</em></span><span>종<em class="${cls}">${fmt(b.close)}</em></span><span class="${ch >= 0 ? 'upc' : 'dnc'}">${sg}${fmt(ch)} (${sg}${pct.toFixed(2)}%)</span>`;
  const di = S.ind && S.ind.di[i];
  $('#diLabel').innerHTML = `DI<small>14 close</small><span class="${di >= 0 ? 'upc' : 'dnc'}">${di == null ? '—' : di.toFixed(2)}</span>`;
}
function renderLegend(){
  $('#lgName').textContent = `${S.sym.name} · ${S.tf[2]} · ${S.live ? S.sym.ex : '시뮬레이션'}`;
  $('#lgCoin').style.background = S.sym.icon;
  $('#lgInds').innerHTML = IND.map(([k, n, p]) =>
    `<button class="ind${S.show[k] ? '' : ' off'}" data-k="${k}" title="${S.show[k] ? '숨기기' : '보이기'}">${n}<small>${p}</small>${S.show[k] ? EYE : EYE_OFF}</button>`).join('');
  renderOhlc();
}
function toggleInd(k){ S.show[k] = !S.show[k]; store.set('show', S.show); applyVisibility(); }
$('#lgInds').addEventListener('click', e => { const b = e.target.closest('.ind'); if (b) toggleInd(b.dataset.k); });

/* 지표 메뉴 */
function renderMenu(){
  $('#indMenu').innerHTML = IND.map(([k, n, p]) => `<label><input type="checkbox" data-k="${k}" ${S.show[k] ? 'checked' : ''}>${n}<small>${p}</small></label>`).join('');
}
$('#indMenu').addEventListener('change', e => { if (e.target.dataset.k) toggleInd(e.target.dataset.k); });
$('#indBtn').onclick = e => {
  e.stopPropagation(); const m = $('#indMenu');
  if (!m.hidden){ m.hidden = true; return; }
  renderMenu(); const r = $('#indBtn').getBoundingClientRect();
  m.style.left = Math.min(r.left, window.innerWidth - 256) + 'px'; m.style.top = (r.bottom + 4) + 'px'; m.hidden = false;
};
document.addEventListener('click', e => { if (!e.target.closest('#indMenu') && !e.target.closest('#indBtn')) $('#indMenu').hidden = true; });

/* ---------- 실시간 / 시뮬레이션 ---------- */
function stopFeed(){ clearInterval(S.timer); S.timer = null; if (S.ws){ S.ws.onclose = null; S.ws.close(); S.ws = null; } }
function setFeed(live, label){ S.live = live; const f = $('#feed'); f.querySelector('span').textContent = label || (live ? '실시간' : '시뮬레이션'); f.classList.toggle('live', live); renderLegend(); }

function onBar(bar){
  const bars = S.bars, last = bars[bars.length - 1], prevPrice = last.close;
  let newBar = false;
  if (bar.time === last.time) bars[bars.length - 1] = bar;
  else if (bar.time > last.time){ bars.push(bar); if (bars.length > 1500) bars.shift(); newBar = true; }
  else return;
  if (newBar){ S.ind = compute(bars); checkSignal(bars.length - 2); }
  renderLast(newBar);
  checkAlerts(prevPrice, bar.close);
}
function startSim(){
  const sigTick = S.sym.dvol * Math.sqrt(S.tf[1] / 86400) / Math.sqrt(30);
  S.ticks = 0;
  S.timer = setInterval(() => {
    const last = S.bars[S.bars.length - 1];
    if (++S.ticks >= 30){
      S.ticks = 0; const o = last.close;
      onBar({ time:last.time + S.tf[1], open:o, high:o, low:o, close:o });
    } else {
      const c = last.close * Math.exp(gauss(Math.random) * sigTick);
      onBar({ ...last, close:c, high:Math.max(last.high, c), low:Math.min(last.low, c) });
    }
  }, 500);
}
async function loadTD(sym, tf){
  const src = tf[3] ? tf : tfBy(tf[5]);
  const u = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym.td)}&interval=${src[3]}&outputsize=${tf[3] ? 1500 : 5000}&timezone=UTC&apikey=${encodeURIComponent(S.cfg.td)}`;
  const j = await (await fetch(u)).json();
  if (j.status === 'error' || !j.values) throw new Error(j.message || 'no data');
  const bars = j.values.slice().reverse().map(v => {
    const d = v.datetime.length === 10 ? v.datetime + 'T00:00:00Z' : v.datetime.replace(' ', 'T') + 'Z';
    return { time:Date.parse(d) / 1000 + KST, open:+v.open, high:+v.high, low:+v.low, close:+v.close };
  });
  return tf[3] ? bars : aggregate(bars, tf[1]).slice(-1500);
}
function startTDPoll(sym, tf, id){
  const sec = Math.max(15, +S.cfg.poll || 120);
  S.timer = setInterval(async () => {
    try {
      const j = await (await fetch(`https://api.twelvedata.com/price?symbol=${encodeURIComponent(sym.td)}&apikey=${encodeURIComponent(S.cfg.td)}`)).json();
      if (id !== S.loadId || S.rp) return;
      const p = +j.price; if (!isFinite(p)) return;
      const last = S.bars[S.bars.length - 1], now = Date.now() / 1000 + KST;
      const k = Math.floor((now - last.time) / tf[1]);
      if (k >= 1) onBar({ time:last.time + k * tf[1], open:last.close, high:Math.max(last.close, p), low:Math.min(last.close, p), close:p });
      else onBar({ ...last, close:p, high:Math.max(last.high, p), low:Math.min(last.low, p) });
    } catch {}
  }, sec * 1000);
}
/* 한텍 MT5 브리지 */
const mt5Get = async path => { const r = await fetch(S.cfg.mt5url + path); const j = await r.json(); if (j.error) throw new Error(j.error); return j; };
const mapBars = arr => arr.map(b => ({ time:b.t + KST, open:b.o, high:b.h, low:b.l, close:b.c }));
async function loadMT5(sym, tf){ return mapBars((await mt5Get(`/bars?symbol=${encodeURIComponent(sym.id)}&tf=${tf[0]}&count=1500`)).bars); }
function startMT5Poll(sym, tf, id){
  S.timer = setInterval(async () => {
    try {
      const bars = mapBars((await mt5Get(`/bars?symbol=${encodeURIComponent(sym.id)}&tf=${tf[0]}&count=2`)).bars);
      if (id !== S.loadId || S.rp) return;
      bars.forEach(onBar);
    } catch {}
  }, 1000);
}
function iconFor(n){
  n = n.toUpperCase();
  if (n.startsWith('XAU') || n.includes('GOLD')) return 'radial-gradient(circle at 35% 35%,#ffe58a,#e0a800)';
  if (n.startsWith('XAG')) return '#b0b6c3';
  if (n.startsWith('BTC')) return '#f7931a';
  if (n.startsWith('ETH')) return '#627eea';
  if (n.includes('OIL')) return '#3c3c3c';
  if (/US100|NAS|US30|US500|SPX|DJ/.test(n)) return '#2962ff';
  return '#9598a1';
}
async function initMT5(){
  clearInterval(S.qtimer); S.qtimer = null;
  if (!S.cfg.mt5) return;
  try {
    const j = await mt5Get('/symbols');
    if (!j.symbols.length) throw new Error('MT5 시장가 창에 종목이 없습니다');
    SYMS = j.symbols.map(x => ({ id:x.name, name:x.desc || x.name, ex:'HANTEC', dp:x.digits, feed:'mt5', icon:iconFor(x.name), base:1, dvol:.01 }));
    S.sym = SYMS.find(x => x.id === store.get('sym')) || SYMS.find(x => /^XAUUSD/.test(x.id)) || SYMS[0];
    $('#sym').innerHTML = SYMS.map(x => `<option value="${x.id}">${x.id}</option>`).join('');
    $('#sym').value = S.sym.id; $('#symIcon').style.background = S.sym.icon;
    const pollQuotes = async () => {
      try {
        const q = (await mt5Get('/quotes')).quotes;
        for (const [k, v] of Object.entries(q)) S.quotes[k] = { p:v.bid, ch:v.chg ?? 0, c:v.pct ?? 0, day:true };
        renderWL();
      } catch {}
    };
    pollQuotes(); S.qtimer = setInterval(pollQuotes, 3000);
  } catch (e) {
    toast('MT5 브리지 연결 안 됨', `${S.cfg.mt5url} 에 연결하지 못했습니다. PC에서 mt5_bridge.py 가 실행 중인지 확인하세요. (${e.message})`);
  }
}
async function loadBinance(sym, tf){
  const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 4000);
  const src = tf[4] ? tf : tfBy(tf[5]);
  const r = await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym.id}&interval=${src[4]}&limit=1000`, { signal:ac.signal });
  clearTimeout(to);
  if (!r.ok) throw new Error('http ' + r.status);
  const bars = (await r.json()).map(k => ({ time:k[0] / 1000 + KST, open:+k[1], high:+k[2], low:+k[3], close:+k[4] }));
  return tf[4] ? bars : aggregate(bars, tf[1]);
}
function openSocket(sym, tf, id){
  try {
    const src = tf[4] ? tf : tfBy(tf[5]);
    const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${sym.id.toLowerCase()}@kline_${src[4]}`);
    ws.onmessage = e => { if (id !== S.loadId) return; const k = JSON.parse(e.data).k;
      const t = Math.floor((k.t / 1000 + KST) / tf[1]) * tf[1], last = S.bars[S.bars.length - 1];
      if (!tf[4] && last.time === t) onBar({ time:t, open:last.open, high:Math.max(last.high, +k.h), low:Math.min(last.low, +k.l), close:+k.c });
      else onBar({ time:tf[4] ? k.t / 1000 + KST : t, open:+k.o, high:+k.h, low:+k.l, close:+k.c }); };
    ws.onclose = () => { if (id === S.loadId){ setFeed(false); startSim(); } };
    S.ws = ws;
  } catch { setFeed(false); startSim(); }
}
async function load(){
  const id = ++S.loadId; stopFeed(); exitReplayUI(); S.draft = null;
  setFeed(false, '연결 중');
  const { sym, tf } = S;
  let live = false, bars;
  if (sym.feed === 'mt5'){
    try { bars = await loadMT5(sym, tf); live = true; }
    catch (e) { toast('MT5 시세 연결 안 됨', `${sym.id}: ${e.message}`); }
  } else if (sym.feed === 'td'){
    if (S.cfg.td){
      try { bars = await loadTD(sym, tf); live = true; }
      catch (e) { toast('시세 연결 안 됨', `${sym.id}: ${e.message}. 시뮬레이션 데이터로 표시합니다.`); }
    }
  } else if (sym.feed === 'binance'){
    try { bars = await loadBinance(sym, tf); live = true; }
    catch { toast('시세 연결 안 됨', `${sym.id} 시세 서버에 연결하지 못해 시뮬레이션 데이터로 표시합니다.`); }
  }
  if (id !== S.loadId) return;
  if (!bars && sym.feed === 'mt5'){ const q = S.quotes[sym.id]; sym.base = q ? q.p : 100; }
  S.bars = bars || genBars(sym, tf[1]);
  S.live = live;
  applyFormat(); renderAll(); applyVisibility();
  applyRange();
  restoreDrawings();
  if (live && sym.feed === 'mt5'){ setFeed(true, '한텍 MT5 · 실시간'); startMT5Poll(sym, tf, id); }
  else if (live && sym.feed === 'td'){ setFeed(true, `실시간 · ${Math.max(15, +S.cfg.poll || 120)}초 갱신`); startTDPoll(sym, tf, id); }
  else if (live){ setFeed(true); openSocket(sym, tf, id); }
  else { setFeed(false); startSim(); }
}

function applyRange(){
  const ts = chart.timeScale(), n = S.bars.length, r = S.range; S.range = null;
  if (!r) return ts.setVisibleLogicalRange({ from:n - 140, to:n + 12 });
  const last = S.bars[n - 1].time, first = S.bars[0].time;
  const from = r === 'ytd' ? Date.UTC(new Date().getUTCFullYear(), 0, 1) / 1000 + KST : last - r;
  if (!isFinite(from) || from <= first) ts.fitContent();
  else ts.setVisibleLogicalRange({ from:timeToIdx(from), to:n + 3 });
}

/* ---------- 신호 / 얼러트 ---------- */
function checkSignal(i){
  if (i < 1 || !S.show.db) return;
  const b = S.bars[i];
  if (isDn(i)) fire(`${S.tf[2]} 돌파 더블비 하방 몸통 마감`, fmt(b.close));
  if (isUp(i)) fire(`${S.tf[2]} 돌파 더블비 상방 몸통 마감`, fmt(b.close));
}
function checkAlerts(prev, cur){
  let hit = false;
  S.alerts = S.alerts.filter(a => {
    if ((prev < a.price && cur >= a.price) || (prev > a.price && cur <= a.price)){
      fire(`가격 ${fmt(a.price)} ${cur >= prev ? '상향' : '하향'} 돌파`, fmt(cur));
      candle.removePriceLine(a.line); hit = true; return false;
    }
    return true;
  });
  if (hit){ renderLists(); saveDrawings(); }
}
function fire(msg, price){
  toast(S.sym.id, msg, true);
  if (!S.rp) sendTelegram(`${S.sym.id} ${msg}\n현재가 ${price}`).catch(() => {});
  const t = new Date().toLocaleTimeString('ko-KR', { hour12:false });
  S.log.unshift({ t, msg:`${S.sym.id} ${msg} · ${price}` }); S.log = S.log.slice(0, 40);
  $('#log').innerHTML = S.log.map(l => `<li><time>${l.t}</time><span>${l.msg}</span></li>`).join('');
}
function toast(title, msg, isAlert){
  const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<div class="ic">${CLOCK}</div><div class="bd"><div class="hd">${isAlert ? '얼러트' : ''}<span>${isAlert ? `<i class="coin" style="background:${S.sym.icon}"></i>` : ''}<b></b></span></div><div class="msg"></div></div><button class="cl" aria-label="닫기">×</button>`;
  el.querySelector('b').textContent = title; el.querySelector('.msg').textContent = msg;
  if (!isAlert) el.querySelector('b').style.fontWeight = '700';
  el.querySelector('.cl').onclick = () => el.remove();
  $('#toasts').prepend(el);
  while ($('#toasts').children.length > 3) $('#toasts').lastChild.remove();
  setTimeout(() => el.remove(), 8000);
}

/* ---------- 그리기 (수평선 · 추세선 · 가격 얼러트) ---------- */
const uid = () => Math.random().toString(36).slice(2);
function addAlert(price){
  const line = candle.createPriceLine({ price, color:C.signal, lineWidth:1, lineStyle:2, title:'얼러트' });
  S.alerts.push({ id:uid(), price, line }); renderLists(); saveDrawings();
}
function addHLine(price){
  const line = candle.createPriceLine({ price, color:C.trend, lineWidth:1, lineStyle:0, title:'' });
  S.hlines.push({ id:uid(), price, line }); saveDrawings();
}
function renderLists(){
  $('#alertList').innerHTML = S.alerts.length
    ? S.alerts.map(a => `<li><span>${S.sym.id} 가격 ${fmt(a.price)} 교차</span><button class="x" data-a="${a.id}">삭제</button></li>`).join('')
    : '<li class="empty">활성 얼러트가 없습니다.</li>';
}
$('#alertList').addEventListener('click', e => {
  const id = e.target.dataset.a; if (!id) return;
  const x = S.alerts.find(v => v.id === id); candle.removePriceLine(x.line);
  S.alerts = S.alerts.filter(v => v !== x); renderLists(); saveDrawings();
});
const dkey = () => `draw:${S.sym.id}`;
function saveDrawings(){
  store.set(dkey(), { a:S.alerts.map(x => x.price), h:S.hlines.map(x => x.price), t:S.trends.map(x => ({ a:x.a, b:x.b })) });
}
function clearDrawingObjects(){
  S.alerts.forEach(x => candle.removePriceLine(x.line)); S.hlines.forEach(x => candle.removePriceLine(x.line));
  S.alerts = []; S.hlines = []; S.trends = [];
}
function restoreDrawings(){
  clearDrawingObjects();
  const d = store.get(dkey(), { a:[], h:[], t:[] });
  (d.a || []).forEach(addAlert); (d.h || []).forEach(addHLine);
  S.trends = (d.t || []).map(x => ({ ...x, id:uid() }));
  renderLists();
}
$('#clearBtn').onclick = () => {
  const keepAlerts = S.alerts.map(a => a.price);
  S.hlines.forEach(x => candle.removePriceLine(x.line)); S.hlines = []; S.trends = []; S.draft = null;
  saveDrawings(); toast('지우기', `수평선과 추세선을 지웠습니다. 얼러트 ${keepAlerts.length}개는 남겨 두었습니다.`);
};
$('#alertForm').addEventListener('submit', e => {
  e.preventDefault();
  const v = parseFloat($('#alertPrice').value.replace(/,/g, ''));
  if (!isFinite(v)) return toast('가격을 확인하세요', '숫자로 된 가격을 입력해야 얼러트를 만들 수 있습니다.');
  addAlert(v); $('#alertPrice').value = '';
});

const HINTS = { trend:'시작점을 클릭하세요', hline:'수평선을 놓을 가격을 클릭하세요', alert:'얼러트 가격을 클릭하세요', replay:'리플레이를 시작할 봉을 클릭하세요' };
function setMode(m){
  S.mode = m; S.draft = null;
  document.querySelectorAll('.tool[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  if (!S.rp) $('#replayBtn').setAttribute('aria-pressed', m === 'replay');
  $('#hint').hidden = m === 'cursor'; $('#hint').textContent = (HINTS[m] || '') + ' · Esc 취소';
}
document.querySelectorAll('.tool[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ setMode('cursor'); $('#setModal').hidden = true; } });
chart.subscribeClick(p => {
  if (!p.point || S.mode === 'cursor') return;
  if (S.mode === 'replay'){ if (p.logical != null){ setMode('cursor'); startReplay(Math.round(p.logical)); } return; }
  const price = candle.coordinateToPrice(p.point.y); if (price == null) return;
  const r = Math.round(price * 10 ** S.sym.dp) / 10 ** S.sym.dp;
  if (S.mode === 'trend'){
    if (p.logical == null) return;
    const pt = { t:idxToTime(p.logical), p:r };
    if (!S.draft){ S.draft = { a:pt, b:null }; $('#hint').textContent = '끝점을 클릭하세요 · Esc 취소'; return; }
    S.trends.push({ id:uid(), a:S.draft.a, b:pt }); saveDrawings(); setMode('cursor'); return;
  }
  if (S.mode === 'hline') addHLine(r); else addAlert(r);
  setMode('cursor');
});

async function sendTelegram(text){
  if (!S.cfg.tg || !S.cfg.chat) return false;
  const r = await fetch(`https://api.telegram.org/bot${S.cfg.tg}/sendMessage`, { method:'POST', body:new URLSearchParams({ chat_id:S.cfg.chat, text }) });
  const j = await r.json(); if (!j.ok) throw new Error(j.description || 'send failed'); return true;
}
function fillSettings(){ $('#setMt5').checked = !!S.cfg.mt5; $('#setMt5Url').value = S.cfg.mt5url; $('#setTd').value = S.cfg.td; $('#setPoll').value = S.cfg.poll; $('#setTg').value = S.cfg.tg; $('#setChat').value = S.cfg.chat; }
function readSettings(){ S.cfg = { mt5:$('#setMt5').checked, mt5url:($('#setMt5Url').value.trim() || 'http://127.0.0.1:8765').replace(/\/+$/, ''), td:$('#setTd').value.trim(), poll:Math.max(15, parseInt($('#setPoll').value, 10) || 120), tg:$('#setTg').value.trim(), chat:$('#setChat').value.trim() }; store.set('cfg', S.cfg); }
$('#setBtn').onclick = () => { fillSettings(); $('#setModal').hidden = false; $('#setTd').focus(); };
$('#setClose').onclick = () => { $('#setModal').hidden = true; };
$('#setModal').addEventListener('click', e => { if (e.target.id === 'setModal') $('#setModal').hidden = true; });
$('#setForm').addEventListener('submit', async e => { e.preventDefault(); readSettings(); $('#setModal').hidden = true; toast('설정 저장됨', '새 설정으로 시세를 다시 불러옵니다.'); await initMT5(); load(); });
$('#tgFind').onclick = async () => {
  readSettings();
  if (!S.cfg.tg) return toast('봇 토큰이 필요합니다', '@BotFather 에서 받은 봇 토큰을 먼저 입력하세요.');
  try {
    const j = await (await fetch(`https://api.telegram.org/bot${S.cfg.tg}/getUpdates`)).json();

    if (!m) return toast('메시지를 찾지 못했습니다', '텔레그램에서 봇에게 아무 메시지나 보낸 뒤 다시 누르세요.');

};
$('#tgTest').onclick = async () => {

  try {
    const ok = await sendTelegram(`웨이브뷰 테스트 얼러트 · ${S.sym.id} ${fmt(S.bars[S.bars.length - 1].close)}`);
    toast(ok ? '텔레그램 전송됨' : '설정이 비어 있습니다', ok ? '휴대폰에서 메시지를 확인하세요.' : '봇 토큰과 채팅 ID를 입력하세요.');
  } catch (e) { toast('텔레그램 전송 실패', e.message || '봇 토큰과 채팅 ID를 확인하세요.'); }
};

/* ---------- 리플레이 ---------- */
function startReplay(idx){
  S.loadId++; stopFeed();
  const full = S.bars.slice();
  idx = Math.max(60, Math.min(full.length - 2, idx));
  S.rp = { full, i:idx, timer:null };
  S.bars = full.slice(0, idx + 1);
  renderAll();
  chart.timeScale().setVisibleLogicalRange({ from:idx - 120, to:idx + 20 });
  $('#replayBar').hidden = false; $('#replayBtn').setAttribute('aria-pressed', true);
  setFeed(false, '리플레이'); rpPos();
}
function rpStep(){
  const r = S.rp; if (!r) return;
  if (r.i + 1 >= r.full.length){ rpPause(); return toast('리플레이 끝', '마지막 봉까지 재생했습니다.'); }
  r.i++; onBar(r.full[r.i]); rpPos();
}
function rpPos(){ const r = S.rp; $('#rp-pos').textContent = new Date(r.full[r.i].time * 1000).toISOString().slice(0, 16).replace('T', ' '); }
function rpPlay(){ const r = S.rp; if (!r) return; rpPause(); r.timer = setInterval(rpStep, +$('#rp-speed').value); $('#rp-play').textContent = '일시정지'; }
function rpPause(){ const r = S.rp; if (r && r.timer){ clearInterval(r.timer); r.timer = null; } $('#rp-play').textContent = '재생'; }
function exitReplayUI(){ if (S.rp){ rpPause(); S.rp = null; } $('#replayBar').hidden = true; $('#replayBtn').setAttribute('aria-pressed', false); }
$('#rp-play').onclick = () => S.rp && S.rp.timer ? rpPause() : rpPlay();
$('#rp-step').onclick = () => { rpPause(); rpStep(); };
$('#rp-speed').onchange = () => { if (S.rp && S.rp.timer) rpPlay(); };
$('#rp-exit').onclick = () => load();
$('#replayBtn').onclick = () => { if (S.rp) return load(); setMode(S.mode === 'replay' ? 'cursor' : 'replay'); };

$('#sym').value = S.sym.id;
$('#sym').onchange = e => selectSym(e.target.value);
function selectSym(id){ S.sym = SYMS.find(s => s.id === id); $('#sym').value = id; $('#symIcon').style.background = S.sym.icon; store.set('sym', id); renderWL(); load(); }
$('#symIcon').style.background = S.sym.icon;

$('#tfs').innerHTML = TFS.map(t => `<button class="tb" data-tf="${t[0]}" aria-pressed="${t === S.tf}">${t[2]}</button>`).join('');
function setTf(k, range){
  S.tf = tfBy(k); S.range = range || null; store.set('tf', k);
  $('#tfs').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.tf === k));
  load();
}
$('#tfs').addEventListener('click', e => { const b = e.target.closest('[data-tf]'); if (b) setTf(b.dataset.tf); });
$('#ranges').innerHTML = RANGES.map((r, i) => `<button class="rb" data-r="${i}">${r[0]}</button>`).join('');
$('#ranges').addEventListener('click', e => {
  const b = e.target.closest('[data-r]'); if (!b) return;
  const r = RANGES[+b.dataset.r];
  if (r[2] === S.tf[0]){ S.range = r[1]; applyRange(); } else setTf(r[2], r[1]);
});
const tick = () => { const d = new Date(Date.now() + KST * 1000); $('#clock').textContent = d.toISOString().slice(11, 19) + ' (UTC+9)'; };
tick(); setInterval(tick, 1000);

function quoteFrom(bars, tf){
  const last = bars[bars.length - 1], back = Math.min(bars.length - 1, Math.max(1, Math.round(86400 / tf)));
  const ref = bars[bars.length - 1 - back].close;
  return { p:last.close, ch:last.close - ref, c:(last.close - ref) / ref * 100 };
}
function updateQuote(){
  const q = S.quotes[S.sym.id], last = S.bars[S.bars.length - 1].close;
  if (S.sym.feed === 'mt5' && q && q.day && S.live){ q.ch += last - q.p; q.c = q.ch / (last - q.ch) * 100; q.p = last; }
  else S.quotes[S.sym.id] = quoteFrom(S.bars, S.tf[1]);
  renderWL();
}
function renderWL(){
  $('#wl').innerHTML = SYMS.map(s => {
    const q = S.quotes[s.id], cls = q && q.c < 0 ? 'dnc' : 'upc';
    return `<button class="wl-row" data-s="${s.id}" aria-current="${s === S.sym}"><span class="s"><i style="background:${s.icon}"></i>${s.id}</span><span>${q ? fmt(q.p, s.dp) : '—'}</span><span class="${cls}">${q ? (q.c >= 0 ? '+' : '') + q.c.toFixed(2) + '%' : ''}</span></button>`;
  }).join('');
  const q = S.quotes[S.sym.id];
  if (q) $('#detail').innerHTML = `<div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px"><i class="coin" style="background:${S.sym.icon}"></i>${S.sym.id}</div><div class="nm">${S.sym.name} · ${S.sym.ex}</div><div class="px">${fmt(q.p)}</div><div class="ch ${q.c < 0 ? 'dnc' : 'upc'}">${q.ch >= 0 ? '+' : ''}${fmt(q.ch)} (${q.c >= 0 ? '+' : ''}${q.c.toFixed(2)}%) <span style="color:var(--sub)">${q.day ? '전일 대비' : '24시간'}</span></div>`;
}
$('#wl').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b && b.dataset.s !== S.sym.id) selectSym(b.dataset.s); });
SYMS.filter(s => s.feed === 'td').forEach(s => { S.quotes[s.id] = quoteFrom(genBars(s, 14400), 14400); });

renderWL(); renderLists(); renderMenu(); requestAnimationFrame(drawOverlay);
initMT5().then(load);
})();
</script>

</body>
</html>
