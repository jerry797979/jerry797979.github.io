<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>웨이브뷰 거래 기록</title>
<style>
/* 웨이브뷰 차트와 같은 어두운 화면. 위: 대결 점수 → 필터 → 핵심 숫자 → 누적 손익 → 탭(기록·날짜별·전략별·시간대별) */
:root{--bg:#131313;--panel:#1b1c20;--line:#2a2b31;--fg:#e0e3eb;--sub:#8b8e98;--me:#2962ff;--bot:#f5a623;--up:#22ab94;--dn:#f23645;--hover:#24262c;
  --sans:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);padding:20px max(16px,env(safe-area-inset-left)) 40px}
main{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
main > *{min-width:0} /* 넓은 표가 페이지 전체를 밀어내지 않게: 표 안에서만 옆으로 넘김 */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.sub{color:var(--sub);font-size:12.5px}
.sp{flex:1}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;height:32px;padding:0 12px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{background:var(--hover)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:stretch}
.vs > *{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:6px;min-width:0}
.card.me{border-top:3px solid var(--me)}.card.bot{border-top:3px solid var(--bot)}
.card .who{font-size:13px;color:var(--sub);font-weight:600}
.card .eq{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.card .row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.card .row b{color:var(--fg);font-variant-numeric:tabular-nums}
.mid{display:grid;place-items:center;text-align:center;gap:4px;padding:0 6px}
.mid .v{font-weight:800;font-size:18px;color:var(--sub)}
.mid .lead{font-size:12.5px;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--bot);overflow:hidden}.bar i{display:block;height:100%;background:var(--me)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{background:none;border:0;color:var(--sub);font:inherit;font-size:13px;padding:5px 12px;border-radius:5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#2a2e39;color:var(--fg);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi small{display:block;color:var(--sub);font-size:11.5px}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;height:260px;position:relative}
.chart canvas{width:100%;height:100%;display:block}
.legend{position:absolute;top:10px;right:14px;display:flex;gap:14px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);font:inherit;font-size:14px;padding:8px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--me);font-weight:600}
.tw{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:560px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td.wrap{white-space:normal;min-width:240px;max-width:460px;line-height:1.45}
th:first-child,td:first-child,td.l,th.l{text-align:left}
th{color:var(--sub);font-weight:500;position:sticky;top:0;background:var(--panel)}
tr:hover td{background:var(--hover)}
.up{color:var(--up)}.dn{color:var(--dn)}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#2a2e39}
.tag.me{background:rgba(41,98,255,.18);color:#7fa3ff}.tag.bot{background:rgba(245,166,35,.16);color:#f5c26b}
.empty{color:var(--sub);padding:28px;text-align:center}
.hbar{display:inline-block;height:10px;border-radius:2px;vertical-align:middle}
@media (max-width:760px){.vs{grid-template-columns:1fr}.mid{padding:4px 0}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
  <header><h1>웨이브뷰 거래 기록</h1><span class="sub" id="sub"></span><span class="sp"></span>
    <button class="btn" id="csv" title="지금 보이는 기록을 엑셀(CSV)로 받기">엑셀로 받기</button></header>
  <section class="vs" id="vs"></section>
  <div class="filters">
    <div class="seg" id="fWho"><button data-v="" aria-pressed="true">두 계좌 모두</button><button data-v="me" aria-pressed="false">🧑 사장님</button><button data-v="bot" aria-pressed="false">🤖 웨이브뷰</button></div>
    <div class="seg" id="fDays"><button data-v="race" aria-pressed="true">대결 시작부터</button><button data-v="1" aria-pressed="false">오늘</button><button data-v="7" aria-pressed="false">7일</button><button data-v="30" aria-pressed="false">30일</button><button data-v="0" aria-pressed="false">전체</button></div>
  </div>
  <section class="kpis" id="kpis"></section>
  <section class="chart"><canvas id="cv"></canvas><div class="legend"><span><i style="background:var(--me)"></i>사장님</span><span><i style="background:var(--bot)"></i>웨이브뷰</span></div></section>
  <nav class="tabs" id="tabs"><button data-t="list" aria-selected="true">거래 기록</button><button data-t="day" aria-selected="false">날짜별</button><button data-t="strat" aria-selected="false">전략별</button><button data-t="hour" aria-selected="false">시간대별</button><button data-t="lab" aria-selected="false">🧪 AI 연구실</button></nav>
  <section id="tab"></section>
</main>
<script>
(() => {
const $ = s => document.querySelector(s), KST = 9 * 3600e3;
const get = (k, d) => { try { const v = localStorage.getItem('wv:' + k); return v ? JSON.parse(v) : d; } catch { return d; } };
const money = v => (v >= 0 ? '+' : '−') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const px = v => v == null ? '—' : v.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
const own = t => t.strat ? 'bot' : 'me';
const STRN = t => t.mt5 ? 'MT5 실거래' : t.strat === 'ai' ? (t.logic ? `AI ${t.rank ? t.rank + '등 ' : ''}· ${t.logic}` : 'AI 판단') : t.strat === 'grid' ? '물타기 자동' : t.strat === 'trail' ? '끌고가기 자동' : '직접 (모의)';
const kd = ms => new Date(ms + KST);
const kst = ms => { const d = kd(ms); return `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2, '0')}:${String(d.getUTCMinutes()).padStart(2, '0')}`; };
let F = { who:'', days:'race', tab:'list' };
function stat(list){
  const w = list.filter(t => t.pnl > 0), l = list.filter(t => t.pnl <= 0), gw = w.reduce((a, t) => a + t.pnl, 0), gl = -l.reduce((a, t) => a + t.pnl, 0);
  let eq = 0, pk = 0, mdd = 0; for (const t of list.slice().sort((a, b) => a.ctime - b.ctime)){ eq += t.pnl; pk = Math.max(pk, eq); mdd = Math.max(mdd, pk - eq); }
  return { n:list.length, net:gw - gl, win:list.length ? w.length / list.length * 100 : 0, pf:gl ? gw / gl : (gw ? Infinity : 0), aw:w.length ? gw / w.length : 0, al:l.length ? gl / l.length : 0, mdd };
}
const pfs = x => x === Infinity ? '∞' : x.toFixed(2);
function data(){
  const P = get('paper', {}), live = get('paperLive', null), seen = new Set(), hist = [];
  for (const h of P.hist || []){ if (seen.has(h.id)) continue; seen.add(h.id); hist.push(h); }  // 같은 거래가 두 번 들어온 것은 하나로
  hist.sort((a, b) => b.ctime - a.ctime);
  return { P, live, hist, race:P.race || 0 };
}
let lastSig = '';
function render(force){
  const { P, live, hist, race } = data();
  // 표·그래프는 거래 기록이나 필터가 바뀔 때만 다시 그린다 (자주 다시 그리면 스크롤이 맨 위로 튄다)
  const sig = [hist.length, hist[0] ? hist[0].id + ':' + hist[0].ctime : '', (P.pos || []).length, F.who, F.days, F.tab, F.tab === 'lab' && live ? live.aiAt : ''].join('|');
  const heavy = force || sig !== lastSig; lastSig = sig;
  $('#sub').textContent = `대결 시작 ${race ? kst(race) : '—'} · 둘 다 $1,000 · ${live ? '차트 창 기준 ' + kst(live.ts) + ' 갱신' : '차트 창을 열어 두면 실시간으로 갱신됩니다'}`;
  // 대결 점수: 차트 창이 계산한 평가금(보유 포지션 손익 포함)을 그대로 쓴다
  const R = hist.filter(t => t.ctime >= race);
  const side = o => { const x = stat(R.filter(t => own(t) === o)), closed = 1000 + x.net, eq = live ? live[o] : closed; return { ...x, eq, ret:(eq - 1000) / 10 }; };
  const me = side('me'), bot = side('bot'), tot = Math.max(1, Math.abs(me.eq - 1000) + Math.abs(bot.eq - 1000));
  const lead = Math.abs(me.eq - bot.eq) < .005 ? '동점' : me.eq > bot.eq ? `🧑 사장님이 $${(me.eq - bot.eq).toFixed(2)} 앞섬` : `🤖 웨이브뷰가 $${(bot.eq - me.eq).toFixed(2)} 앞섬`;
  const card = (k, n, x, note) => `<div class="card ${k}"><div class="who">${n}</div><div class="eq ${x.eq >= 1000 ? 'up' : 'dn'}">$${x.eq.toFixed(2)}</div>
    <div class="row"><span>수익률 <b class="${x.ret >= 0 ? 'up' : 'dn'}">${x.ret >= 0 ? '+' : ''}${x.ret.toFixed(2)}%</b></span><span>거래 <b>${x.n}</b>건</span><span>승률 <b>${x.win.toFixed(0)}%</b></span><span>손익비 <b>${pfs(x.pf)}</b></span></div>
    ${note ? `<div class="row" style="font-size:12px">${note}</div>` : ''}</div>`;
  const share = 50 + ((me.eq - 1000) - (bot.eq - 1000)) / tot * 50;
  $('#vs').innerHTML = card('me', live && live.mt5Me ? '🧑 사장님 (MT5 실거래)' : '🧑 사장님', me, '')
    + `<div class="mid"><div class="v">VS</div><div class="lead">${lead}</div><div class="bar" style="width:120px"><i style="width:${Math.max(0, Math.min(100, share))}%"></i></div></div>`
    + card('bot', '🤖 웨이브뷰 (AI 판단 · 24시간)', bot, live && live.ai ? '🤖 ' + live.ai : '');
  // 필터
  const now = Date.now(), dd = F.days;
  const from = dd === 'race' ? race : dd === '1' ? (() => { const d = kd(now); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - KST; })() : +dd ? now - +dd * 86400e3 : 0;
  const T = hist.filter(t => t.ctime >= from && (!F.who || own(t) === F.who)), A = stat(T);
  const kp = (k, v, c) => `<div class="kpi"><small>${k}</small><b class="${c || ''}">${v}</b></div>`;
  $('#kpis').innerHTML = kp('순손익', money(A.net), A.net >= 0 ? 'up' : 'dn') + kp('거래 수', A.n.toLocaleString() + '건') + kp('승률', A.win.toFixed(1) + '%') + kp('손익비 (PF)', pfs(A.pf))
    + kp('평균 이익', money(A.aw), 'up') + kp('평균 손실', money(-A.al), 'dn') + kp('최대 낙폭', '−$' + A.mdd.toFixed(2), 'dn') + kp('보유 중', ((P.pos || []).length) + '건');
  if (!heavy) return;
  drawChart(T);
  // 탭 (보던 스크롤 위치는 지킨다)
  const tab = $('#tab'), tw0 = tab.querySelector('.tw:last-child'), keepY = tw0 ? tw0.scrollTop : 0, keepX = tw0 ? tw0.scrollLeft : 0;
  requestAnimationFrame(() => { const tw = tab.querySelector('.tw:last-child'); if (tw && !force){ tw.scrollTop = keepY; tw.scrollLeft = keepX; } });
  if (F.tab === 'lab'){
    const top = (live && live.aiTop) || [];
    tab.innerHTML = `<div class="tw" style="padding:14px 16px;display:grid;gap:10px">
      <div class="sub">PC의 웨이브뷰 AI가 매시간 새 로직을 만들어 최근 3일 전까지(최대 20일)로 만들고 최근 3일로 검증합니다. 5분·15분·1시간봉을 모두 시험하고, 실전에서 4연패한 로직은 24시간 쉬며, 하루 $30 넘게 잃으면 그날은 쉽니다. 통과한 것 중 1등을 쓰되, 지금 로직보다 10% 넘게 좋을 때만 바꿉니다.
      ${live && live.aiGen ? `<br>지금까지 ${live.aiGen}번 연구 · 마지막 연구 ${kst(live.aiAt * 1000)}` : '<br>아직 연구 결과가 없습니다 (연결 프로그램이 새 버전으로 바뀌면 1시간 안에 시작합니다)'}</div>
      ${live && live.ai ? `<div>🤖 ${live.ai}</div>` : ''}</div>
      <div class="tw" style="margin-top:10px"><table><tr><th>순위</th><th class="l">로직</th><th>학습 기간 거래</th><th>승률</th><th>손익비</th><th>학습 기간 손익</th><th>최근 3일 검증</th><th>한 달 환산</th><th class="l">판정</th></tr>${top.map((x, k) =>
        `<tr><td>${k + 1}</td><td class="l" style="white-space:normal;min-width:320px">${x.new ? '<span class="tag bot">새 로직</span> ' : ''}${x.name}</td><td>${x.n}</td><td>${x.win.toFixed(0)}%</td><td>${pfs(x.pf)}</td><td class="${x.net >= 0 ? 'up' : 'dn'}">${money(x.net)}</td><td class="${x.vnet >= 0 ? 'up' : 'dn'}">${money(x.vnet)} (${x.vn}번)</td><td class="${(x.mon || 0) >= 0 ? 'up' : 'dn'}">${money(x.mon || 0)}</td><td class="l">${x.ok ? '✅ 통과' : '❌ 탈락'}</td></tr>`).join('') || '<tr><td colspan="9" class="empty">아직 순위가 없습니다</td></tr>'}</table></div>`;
    window._rows = T; return;
  }
  if (!T.length){ tab.innerHTML = `<div class="tw"><div class="empty">이 기간·계좌에 끝난 거래가 없습니다.</div></div>`; window._rows = T; return; }
  window._rows = T;
  if (F.tab === 'list'){
    tab.innerHTML = `<div class="tw"><table><tr><th>청산 시각 (한국)</th><th class="l">계좌 · 전략</th><th class="l">종목</th><th>방향</th><th>랏</th><th>진입가</th><th>청산가</th><th>손익</th><th class="l">청산 이유</th></tr>${T.slice(0, 1000).map(t =>
      `<tr><td>${kst(t.ctime)}</td><td class="l wrap"><span class="tag ${own(t)}">${own(t) === 'me' ? '사장님' : '웨이브뷰'}</span> ${STRN(t)}</td><td class="l">${t.sym || ''}</td><td class="${t.dir > 0 ? 'up' : 'dn'}">${t.dir > 0 ? '매수' : '매도'}</td><td>${t.lots}</td><td>${px(t.open)}</td><td>${px(t.close)}</td><td class="${t.pnl >= 0 ? 'up' : 'dn'}">${money(t.pnl)}</td><td class="l">${t.why || ''}</td></tr>`).join('')}</table>${T.length > 1000 ? '<div class="empty">최근 1,000건만 보여 줍니다. 전체는 엑셀로 받으세요.</div>' : ''}</div>`;
  } else {
    const key = F.tab === 'day' ? (t => { const d = kd(t.ctime); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; })
      : F.tab === 'strat' ? (t => (own(t) === 'me' ? '🧑 ' : '🤖 ') + STRN(t)) : (t => String(kd(t.ctime).getUTCHours()).padStart(2, '0') + '시');
    const g = new Map(); for (const t of T){ const k = key(t); if (!g.has(k)) g.set(k, []); g.get(k).push(t); }
    let rows = [...g].map(([k, list]) => [k, stat(list)]);
    rows.sort(F.tab === 'day' ? (a, b) => b[0].localeCompare(a[0]) : F.tab === 'hour' ? (a, b) => a[0].localeCompare(b[0]) : (a, b) => b[1].net - a[1].net);
    const mx = Math.max(...rows.map(r => Math.abs(r[1].net)), 1);
    tab.innerHTML = `<div class="tw"><table><tr><th>${F.tab === 'day' ? '날짜 (한국)' : F.tab === 'strat' ? '계좌 · 전략' : '청산 시간대 (한국)'}</th><th>거래</th><th>승률</th><th>손익비</th><th>순손익</th><th class="l" style="width:30%"></th></tr>${rows.map(([k, x]) =>
      `<tr><td class="${F.tab === 'strat' ? 'l wrap' : ''}">${k}</td><td>${x.n}</td><td>${x.win.toFixed(1)}%</td><td>${pfs(x.pf)}</td><td class="${x.net >= 0 ? 'up' : 'dn'}">${money(x.net)}</td><td class="l"><span class="hbar" style="width:${Math.abs(x.net) / mx * 100}%;background:${x.net >= 0 ? 'var(--up)' : 'var(--dn)'}"></span></td></tr>`).join('')}</table></div>`;
  }
}
function drawChart(T){
  const cv = $('#cv'), r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, r.width, r.height);
  const asc = T.slice().sort((a, b) => a.ctime - b.ctime); if (!asc.length) return;
  const t0 = asc[0].ctime, t1 = Math.max(asc[asc.length - 1].ctime, t0 + 1), lines = {};
  for (const o of ['me', 'bot']){ let e = 0; lines[o] = [[t0, 0]]; for (const t of asc) if (own(t) === o){ e += t.pnl; lines[o].push([t.ctime, e]); } }
  const vals = [0, ...lines.me.map(p => p[1]), ...lines.bot.map(p => p[1])], mn = Math.min(...vals), mx = Math.max(...vals);
  const W = r.width, H = r.height, L = 64, X = t => L + (t - t0) / (t1 - t0) * (W - L - 16), Y = v => H - 24 - (v - mn) / ((mx - mn) || 1) * (H - 56);
  g.font = '11px ' + getComputedStyle(document.body).fontFamily; g.fillStyle = '#8b8e98';
  g.fillText('누적 손익', 12, 18);
  for (const v of [mx, 0, mn].filter((v, i, a) => a.findIndex(w => Math.abs(Y(w) - Y(v)) < 14) === i)){ g.fillText(money(v), 6, Y(v) + 4); g.strokeStyle = v === 0 ? 'rgba(139,142,152,.5)' : 'rgba(139,142,152,.15)'; g.setLineDash(v === 0 ? [4, 4] : []); g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(W - 12, Y(v)); g.stroke(); }
  g.setLineDash([]); g.fillText(kst(t0), L, H - 6); const e = kst(t1); g.fillText(e, W - 12 - g.measureText(e).width, H - 6);
  for (const [o, col] of [['me', '#2962ff'], ['bot', '#f5a623']]){ const ps = lines[o]; if (ps.length < 2) continue;
    g.strokeStyle = col; g.lineWidth = 2; g.lineJoin = 'round'; g.beginPath(); ps.forEach(([t, v], i) => i ? g.lineTo(X(t), Y(v)) : g.moveTo(X(t), Y(v))); g.stroke();
    const [lt, lv] = ps[ps.length - 1]; g.fillStyle = col; g.beginPath(); g.arc(X(lt), Y(lv), 3.5, 0, 7); g.fill(); }
}
